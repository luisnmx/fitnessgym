<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitnesGym Studio — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d0f;
    --surface: #15171a;
    --surface-2: #1b1e22;
    --border: #262a2e;
    --text: #f2f3f5;
    --text-muted: #8b9198;
    --green: #2ecc71;
    --green-hover: #29b765;
    --green-dim: rgba(46,204,113,.12);
    --red: #ef4444;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  /* leve resplandor verde de fondo, igual que el dashboard */
  body::before{
    content:"";
    position:fixed;
    top:-120px;
    right:-120px;
    width:420px;
    height:420px;
    background:radial-gradient(circle, rgba(46,204,113,.10) 0%, transparent 70%);
    pointer-events:none;
  }

  .status{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--text-muted);
  }
  .status .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px rgba(46,204,113,.7);
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px 28px;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:24px;
  }
  .brand .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .brand .sub{
    font-size:11px;
    font-weight:700;
    color:var(--green);
    letter-spacing:.25em;
    margin-top:2px;
  }

  h1{
    font-size:19px;
    font-weight:700;
    text-align:center;
    margin:0 0 4px;
  }
  .subtitle{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    margin:0 0 28px;
  }

  form{ display:flex; flex-direction:column; gap:16px; }

  label.field-label{
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    display:block;
  }

  .input-wrap{ position:relative; }

  .input-wrap input{
    width:100%;
    height:44px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:0 42px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .input-wrap input::placeholder{ color:#565b62; }
  .input-wrap input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px var(--green-dim);
  }

  .input-wrap svg.icon-left{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
    pointer-events:none;
  }
  .input-wrap input:focus ~ svg.icon-left{ color:var(--green); }

  .toggle-eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    padding:6px;
    display:flex;
  }
  .toggle-eye:hover{ color:var(--text); }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:2px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
  }
  .remember input{ display:none; }
  .checkbox{
    width:16px;
    height:16px;
    border-radius:4px;
    border:1px solid var(--border);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .remember input:checked + .checkbox{
    background:var(--green);
    border-color:var(--green);
  }
  .remember input:checked + .checkbox svg{ display:block; }
  .checkbox svg{ display:none; color:#06210f; }

  a.link{
    font-size:13px;
    color:var(--green);
    text-decoration:none;
    font-weight:500;
  }
  a.link:hover{ text-decoration:underline; }

  .submit{
    margin-top:8px;
    height:44px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:#06210f;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s;
  }
  .submit:hover{ background:var(--green-hover); }
  .submit:disabled{ cursor:default; opacity:.85; }

  .error{
    display:none;
    font-size:13px;
    color:var(--red);
    background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.25);
    border-radius:8px;
    padding:8px 12px;
  }
  .error.show{ display:block; }

  .footer-note{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--border);
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
  }
  .footer-note a{ color:var(--green); text-decoration:none; font-weight:500; }
  .footer-note a:hover{ text-decoration:underline; }

  .copyright{
    text-align:center;
    font-size:11px;
    color:#4a4f55;
    margin-top:18px;
  }

  @media (prefers-reduced-motion:no-preference){
    .card{ animation:fade-up .35s ease-out; }
    @keyframes fade-up{
      from{ opacity:0; transform:translateY(6px); }
      to{ opacity:1; transform:translateY(0); }
    }
  }
</style>
<script src="../js/auth.js"></script>
<script>try { FitnesGymAuth.redirectIfAuthenticated(); } catch (e) {}</script>
</head>
<body>

  <div class="status"><span class="dot"></span> ONLINE</div>

  <div>
    <div class="card">
      <div class="brand">
        <span class="name">FitnesGym</span>
        <span class="sub">STUDIO</span>
      </div>

      <h1>Iniciar sesión</h1>
      <p class="subtitle">Accedé al panel de administración de tu gimnasio</p>

      <form id="loginForm" novalidate>
        <div>
          <label class="field-label" for="username">Usuario o correo</label>
          <div class="input-wrap">
            <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke="none"/><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            <input id="username" name="username" type="text" placeholder="admin@fitnesgym.com" autocomplete="username" required>
          </div>
        </div>

        <div>
          <label class="field-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            <input id="password" name="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-eye" id="eyeBtn" aria-label="Mostrar contraseña">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="errorBox" class="error">Usuario o contraseña incorrectos.</div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span class="checkbox"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>
            Recordarme
          </label>
          <a class="link" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          <span id="btnText">Iniciar sesión</span>
        </button>
      </form>

      <div class="footer-note">
        ¿Problemas de acceso? <a href="#">Soporte técnico</a>
      </div>
    </div>

    <p class="copyright">© 2026 FitnesGym Studio — Sistema de Gestión Integral</p>
  </div>

<script>
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const passwordInput = document.getElementById('password');

  eyeBtn.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing
      ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.7 21.7 0 01-2.44 3.34M1 1l22 22"/><path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>';
  });

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const errorBox = document.getElementById('errorBox');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    btnText.textContent = 'Verificando…';

    setTimeout(() => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      const ok = FitnesGymAuth.login(username, password, remember);
      submitBtn.disabled = false;
      btnText.textContent = 'Iniciar sesión';

      if (ok) {
        window.location.replace('index.html');
      } else {
        errorBox.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }, 500);
  });
</script>

</body>
</html>
